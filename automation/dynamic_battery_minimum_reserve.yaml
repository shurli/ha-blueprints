blueprint:
  name: Dynamische Batterie-Mindestreserve nach Ladehistorie
  description: >
    Passt die Mindestreserve eines Batteriespeichers alle X Tage an.
    Wurde innerhalb des einstellbaren kurzen Beobachtungszeitraums
    ein Ladezustand von 100 % erreicht, sinkt die Reserve um eine
    Schrittweite. Wurde innerhalb des einstellbaren langen
    Beobachtungszeitraums keine volle Ladung erreicht, steigt sie. Dazwischen bleibt die Reserve unveraendert. Die Reserve bleibt innerhalb der definierten
    Grenzen. Benoetigt Recorder-Statistiken fuer den SOC-Sensor
    (state_class: measurement, Einheit %). Die Aktion recorder.get_statistics
    erfordert Administratorrechte.
  domain: automation
  input:
    battery_soc:
      name: Akku-Ladezustand
      description: Sensor mit Ladezustand in Prozent und Recorder-Statistiken.
      selector:
        entity:
          domain: sensor
    reserve_number:
      name: Mindest-Ladezustand
      description: Number-Entity, die die Mindestreserve in Prozent steuert.
      selector:
        entity:
          domain: number
    adjustment_time:
      name: Taegliche Pruefzeit
      default: "13:00:00"
      selector:
        time: {}
    check_interval_days:
      name: Pruefintervall (alle X Tage)
      description: 1 = taeglich, 2 = jeden zweiten Tag usw. Fester Kalenderanker 2020-01-01.
      default: 1
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: d
          mode: box
    increase_window_days:
      name: Beobachtungszeitraum fuer Erhoehung (Tage)
      description: Ohne volle Ladung in diesem Zeitraum wird die Reserve erhoeht.
      default: 3
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: d
          mode: box
    decrease_window_days:
      name: Beobachtungszeitraum fuer Reduzierung (Tage)
      description: Volle Ladung in diesem Zeitraum reduziert die Reserve. Achtung, dieselbe Ladung kann bei mehreren Pruefungen erneut zaehlen.
      default: 24
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: d
          mode: box
    increase_step_percent:
      name: Schrittweite fuer Erhoehung (Prozentpunkte)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    decrease_step_percent:
      name: Schrittweite fuer Reduzierung (Prozentpunkte)
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_reserve:
      name: Untere Reservegrenze
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_reserve:
      name: Obere Reservegrenze
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

variables:
  check_interval: !input check_interval_days

triggers:
  - trigger: time
    at: !input adjustment_time

conditions:
  - condition: template
    value_template: >-
      {% set interval = check_interval | int(1) %}
      {{ interval > 0 and ((now().date() - strptime('2020-01-01', '%Y-%m-%d').date()).days % interval) == 0 }}

actions:
  - variables:
      soc_entity: !input battery_soc
      reserve_entity: !input reserve_number
      increase_step: !input increase_step_percent
      decrease_step: !input decrease_step_percent
      lower_limit: !input min_reserve
      upper_limit: !input max_reserve
      increase_days: !input increase_window_days
      decrease_days: !input decrease_window_days
      history_start: "{{ (now() - timedelta(days=[increase_days | int, decrease_days | int] | max)).isoformat() }}"
      increase_start: "{{ (now() - timedelta(days=increase_days | int)).isoformat() }}"
      history_end: "{{ now().isoformat() }}"
      recent_start: "{{ (now() - timedelta(days=decrease_days | int)).isoformat() }}"
  - action: recorder.get_statistics
    data:
      statistic_ids:
        - "{{ soc_entity }}"
      start_time: "{{ history_start }}"
      end_time: "{{ history_end }}"
      period: 5minute
      types:
        - max
    response_variable: battery_history
  - variables:
      increase_window_maximum: >-
        {% set rows = battery_history.get('statistics', {}).get(soc_entity, []) %}
        {% set ns = namespace(highest=-1) %}
        {% set cutoff = as_timestamp(increase_start) %}
        {% for row in rows %}
          {% if as_timestamp(row.get('end'), 0) > cutoff and row.get('max') is not none %}
            {% set ns.highest = [ns.highest, row['max'] | float(-1)] | max %}
          {% endif %}
        {% endfor %}
        {{ ns.highest }}
      recent_full_charge: >-
        {% set rows = battery_history.get('statistics', {}).get(soc_entity, []) %}
        {% set cutoff = as_timestamp(recent_start) %}
        {% set ns = namespace(found=false) %}
        {% for row in rows %}
          {% if as_timestamp(row.get('end'), 0) > cutoff
                and row.get('max') is not none
                and row['max'] | float(-1) >= 100 %}
            {% set ns.found = true %}
          {% endif %}
        {% endfor %}
        {{ ns.found }}
      history_coverage_ok: >-
        {% set rows = battery_history.get('statistics', {}).get(soc_entity, []) %}
        {{ rows | count > 0
           and as_timestamp(rows[0]['start'], 0) <= as_timestamp(history_start) + 3600
           and as_timestamp(rows[-1]['end'], 0) >= as_timestamp(history_end) - 3600 }}
      current_reserve: "{{ states(reserve_entity) | float(none) }}"
      current_soc: "{{ states(soc_entity) | float(none) }}"
  - condition: template
    value_template: >-
      {{ history_coverage_ok | bool(false)
         and increase_window_maximum | float(-1) >= 0
         and current_reserve is not none
         and lower_limit | float <= upper_limit | float }}
  - variables:
      desired_reserve: >-
        {% set current = current_reserve | float %}
        {% set up_step = increase_step | float %}
        {% set down_step = decrease_step | float %}
        {% set low = [lower_limit | float, state_attr(reserve_entity, 'min') | float(0)] | max %}
        {% set high = [upper_limit | float, state_attr(reserve_entity, 'max') | float(100)] | min %}
        {% if recent_full_charge | bool(false) %}
          {{ [low, current - down_step] | max }}
        {% elif increase_window_maximum | float < 100 %}
          {% set soc = current_soc | float(-1) %}
          {% set safe_ceiling = (soc - 1) | round(0, 'floor') %}
          {% if soc >= 0 and safe_ceiling > current %}
            {{ [high, current + up_step, safe_ceiling] | min }}
          {% else %}
            {{ current }}
          {% endif %}
        {% else %}
          {{ current }}
        {% endif %}
  - condition: template
    value_template: >-
      {{ desired_reserve | float != current_reserve | float
         and desired_reserve | float >= lower_limit | float
         and desired_reserve | float <= upper_limit | float
         and (desired_reserve | float <= current_reserve | float
              or (states(soc_entity) | float(-1) >= 0
                  and desired_reserve | float < states(soc_entity) | float(-1))) }}
  - action: number.set_value
    target:
      entity_id: !input reserve_number
    data:
      value: "{{ desired_reserve | float }}"

mode: single
