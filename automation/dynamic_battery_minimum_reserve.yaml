blueprint:
  name: Dynamische Batterie-Mindestreserve mit getrennten Sperrzeiten
  description: >
    Erhoeht die Mindestreserve nach einer einstellbaren Zeit ohne volle
    Akkuladung bei der geplanten Pruefung. Reduziert sie sofort beim
    Erreichen von 100 Prozent. Beide Richtungen haben eigene Sperrzeiten.
    Die Sperrzeiten werden aus der Recorder-History der number-Entity
    ermittelt. Benoetigt eine eingerichtete SQL-Integration (sql.query)
    sowie Recorder-Statistiken des SOC-Sensors. Die History muss laenger
    aufbewahrt werden als die laengste Sperrzeit. Bei fehlender Historie
    kann eine vorherige Aenderung nicht erkannt werden. Eine Erhoehung
    bleibt mindestens einen Prozentpunkt unter dem aktuellen SOC.
  domain: automation
  input:
    battery_soc:
      name: Akku-Ladezustand
      selector:
        entity:
          domain: sensor
    reserve_number:
      name: Mindestreserve
      selector:
        entity:
          domain: number
    adjustment_time:
      name: Pruefzeit
      default: "13:00:00"
      selector:
        time: {}
    check_interval_days:
      name: Pruefintervall (alle X Tage)
      default: 1
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: d
          mode: box
    increase_window_days:
      name: Beobachtungszeitraum ohne Vollladung (Tage)
      default: 3
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: d
          mode: box
    increase_lock_days:
      name: Sperrzeit nach Erhoehung (Tage)
      default: 1
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: d
          mode: box
    decrease_lock_hours:
      name: Sperrzeit nach Reduzierung (Stunden)
      default: 24
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: h
          mode: box
    increase_step_percent:
      name: Schrittweite Erhoehung (Prozentpunkte)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    decrease_step_percent:
      name: Schrittweite Reduzierung (Prozentpunkte)
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_reserve:
      name: Untere Reservegrenze
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_reserve:
      name: Obere Reservegrenze
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

triggers:
  - trigger: time
    at: !input adjustment_time
    id: scheduled
  - trigger: numeric_state
    entity_id: !input battery_soc
    above: 99.99
    id: full_charge

conditions: []

actions:
  - variables:
      soc_entity: !input battery_soc
      reserve_entity: !input reserve_number
      interval_days: !input check_interval_days
      observation_days: !input increase_window_days
      increase_cooldown_days: !input increase_lock_days
      decrease_cooldown_hours: !input decrease_lock_hours
      up_step: !input increase_step_percent
      down_step: !input decrease_step_percent
      lower_limit: !input min_reserve
      upper_limit: !input max_reserve
  - action: sql.query
    data:
      query: >-
        SELECT
          MAX(CASE WHEN CAST(s.state AS REAL) > CAST(p.state AS REAL)
              THEN s.last_updated_ts END) AS last_increase,
          MAX(CASE WHEN CAST(s.state AS REAL) < CAST(p.state AS REAL)
              THEN s.last_updated_ts END) AS last_decrease
        FROM states s
        JOIN states_meta m ON s.metadata_id = m.metadata_id
        JOIN states p ON p.state_id = s.old_state_id
        WHERE m.entity_id = '{{ reserve_entity }}'
          AND s.state NOT IN ('unknown', 'unavailable')
          AND p.state NOT IN ('unknown', 'unavailable')
    response_variable: reserve_history
  - variables:
      last_up_ts: >-
        {% set rows = reserve_history.get('result', []) %}
        {{ rows[0].get('last_increase') | float(0) if rows | count > 0 else 0 }}
      last_down_ts: >-
        {% set rows = reserve_history.get('result', []) %}
        {{ rows[0].get('last_decrease') | float(0) if rows | count > 0 else 0 }}
  - choose:
      - conditions:
          - condition: trigger
            id: full_charge
        sequence:
          - condition: template
            value_template: >-
              {{ as_timestamp(now()) - last_down_ts | float(0)
                 >= decrease_cooldown_hours | float * 3600
                 and lower_limit | float <= upper_limit | float }}
          - variables:
              old_reserve: "{{ states(reserve_entity) | float(none) }}"
              new_reserve: >-
                {% set low = [lower_limit | float, state_attr(reserve_entity, 'min') | float(0)] | max %}
                {{ [low, (states(reserve_entity) | float(0)) - (down_step | float)] | max }}
          - condition: template
            value_template: >-
              {{ old_reserve is not none
                 and new_reserve | float < old_reserve | float
                 and new_reserve | float >= lower_limit | float }}
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ new_reserve | float }}"
      - conditions:
          - condition: trigger
            id: scheduled
          - condition: template
            value_template: >-
              {{ interval_days | int > 0
                 and ((now().date() - strptime('2020-01-01', '%Y-%m-%d').date()).days
                      % (interval_days | int)) == 0 }}
        sequence:
          - condition: template
            value_template: >-
              {{ as_timestamp(now()) - last_up_ts | float(0)
                     >= increase_cooldown_days | float * 86400
                 and lower_limit | float <= upper_limit | float }}
          - variables:
              history_start: "{{ (now() - timedelta(days=observation_days | int)).isoformat() }}"
              history_end: "{{ now().isoformat() }}"
          - action: recorder.get_statistics
            data:
              statistic_ids:
                - "{{ soc_entity }}"
              start_time: "{{ history_start }}"
              end_time: "{{ history_end }}"
              period: 5minute
              types:
                - max
            response_variable: soc_history
          - variables:
              no_full_charge: >-
                {% set rows = soc_history.get('statistics', {}).get(soc_entity, []) %}
                {% set ns = namespace(highest=-1) %}
                {% for row in rows %}
                  {% if row.get('max') is not none %}
                    {% set ns.highest = [ns.highest, row['max'] | float(-1)] | max %}
                  {% endif %}
                {% endfor %}
                {{ rows | count > 0
                   and as_timestamp(rows[0]['start'], 0) <= as_timestamp(history_start) + 3600
                   and as_timestamp(rows[-1]['end'], 0) >= as_timestamp(history_end) - 3600
                   and ns.highest >= 0 and ns.highest < 100 }}
          - condition: template
            value_template: "{{ no_full_charge | bool(false) }}"
          - variables:
              old_reserve: "{{ states(reserve_entity) | float(none) }}"
              new_reserve: >-
                {% set current = states(reserve_entity) | float(-1) %}
                {% set soc = states(soc_entity) | float(-1) %}
                {% set high = [upper_limit | float, state_attr(reserve_entity, 'max') | float(100)] | min %}
                {% set safe = (soc - 1) | round(0, 'floor') %}
                {% if current >= 0 and soc >= 0 and safe > current %}
                  {{ [high, current + up_step | float, safe] | min }}
                {% else %}
                  {{ current }}
                {% endif %}
          - condition: template
            value_template: >-
              {{ old_reserve is not none
                 and new_reserve | float > old_reserve | float
                 and new_reserve | float <= upper_limit | float
                 and new_reserve | float <= states(soc_entity) | float(-1) - 1 }}
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ new_reserve | float }}"

mode: queued
max: 5
