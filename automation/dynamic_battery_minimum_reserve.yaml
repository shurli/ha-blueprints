blueprint:
  name: Dynamische Batterie-Mindestreserve mit getrennten Sperrzeiten
  description: >
    Erhoeht die Mindestreserve nach einer einstellbaren Zeit ohne volle
    Akkuladung bei der geplanten Pruefung. Reduziert sie sofort beim
    Erreichen von 100 Prozent. Beide Richtungen haben eigene Sperrzeiten.
    Zwei input_datetime-Helfer mit Datum und Uhrzeit speichern die
    letzten erfolgreichen Anpassungen dauerhaft, auch ueber Neustarts.
    Ein dritter input_datetime-Helfer speichert die letzte Vollladung.
    Die Erhoehung bleibt mindestens einen Prozentpunkt unter dem SOC.
    Vor der ersten erfassten Vollladung ist keine Erhoehung moeglich.
  domain: automation
  input:
    battery_soc:
      name: Akku-Ladezustand
      selector:
        entity:
          domain: sensor
    reserve_number:
      name: Mindestreserve
      selector:
        entity:
          domain: number
    last_full_charge:
      name: Zeitpunkt der letzten Vollladung
      description: input_datetime-Helfer mit Datum und Uhrzeit; wird bei 100 Prozent aktualisiert.
      selector:
        entity:
          domain: input_datetime
    last_increase:
      name: Zeitpunkt der letzten Erhoehung
      description: Separater input_datetime-Helfer mit Datum und Uhrzeit.
      selector:
        entity:
          domain: input_datetime
    last_decrease:
      name: Zeitpunkt der letzten Reduzierung
      description: Separater input_datetime-Helfer mit Datum und Uhrzeit.
      selector:
        entity:
          domain: input_datetime
    adjustment_time:
      name: Pruefzeit
      default: "13:00:00"
      selector:
        time: {}
    check_interval_days:
      name: Pruefintervall (alle X Tage)
      default: 1
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: d
          mode: box
    increase_window_days:
      name: Beobachtungszeitraum ohne Vollladung (Tage)
      default: 3
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: d
          mode: box
    increase_lock_days:
      name: Sperrzeit nach Erhoehung (Tage)
      default: 1
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: d
          mode: box
    decrease_lock_hours:
      name: Sperrzeit nach Reduzierung (Stunden)
      default: 24
      selector:
        number:
          min: 0
          max: 720
          step: 1
          unit_of_measurement: h
          mode: box
    increase_step_percent:
      name: Schrittweite Erhoehung (Prozentpunkte)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    decrease_step_percent:
      name: Schrittweite Reduzierung (Prozentpunkte)
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_reserve:
      name: Untere Reservegrenze
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_reserve:
      name: Obere Reservegrenze
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

triggers:
  - trigger: time
    at: !input adjustment_time
    id: scheduled
  - trigger: numeric_state
    entity_id: !input battery_soc
    above: 99.99
    id: full_charge

conditions: []

actions:
  - variables:
      soc_entity: !input battery_soc
      reserve_entity: !input reserve_number
      full_charge_helper: !input last_full_charge
      increase_helper: !input last_increase
      decrease_helper: !input last_decrease
      interval_days: !input check_interval_days
      observation_days: !input increase_window_days
      increase_cooldown_days: !input increase_lock_days
      decrease_cooldown_hours: !input decrease_lock_hours
      up_step: !input increase_step_percent
      down_step: !input decrease_step_percent
      lower_limit: !input min_reserve
      upper_limit: !input max_reserve
  - choose:
      - conditions:
          - condition: trigger
            id: full_charge
        sequence:
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_full_charge
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
          - condition: template
            value_template: >-
              {{ as_timestamp(now()) - as_timestamp(states(decrease_helper), 0)
                 >= decrease_cooldown_hours | float * 3600
                 and lower_limit | float <= upper_limit | float }}
          - variables:
              old_reserve: "{{ states(reserve_entity) | float(none) }}"
              new_reserve: >-
                {% set low = [lower_limit | float, state_attr(reserve_entity, 'min') | float(0)] | max %}
                {{ [low, states(reserve_entity) | float(0) - down_step | float] | max }}
          - condition: template
            value_template: >-
              {{ old_reserve is not none
                 and new_reserve | float < old_reserve | float
                 and new_reserve | float >= lower_limit | float }}
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ new_reserve | float }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_decrease
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - conditions:
          - condition: trigger
            id: scheduled
          - condition: template
            value_template: >-
              {{ interval_days | int > 0
                 and ((now().date() - strptime('2020-01-01', '%Y-%m-%d').date()).days
                      % (interval_days | int)) == 0 }}
        sequence:
          - condition: template
            value_template: >-
              {% set full = as_timestamp(states(full_charge_helper), 0) %}
              {{ full > 0
                 and as_timestamp(now()) - full >= observation_days | float * 86400
                 and as_timestamp(now()) - as_timestamp(states(increase_helper), 0)
                     >= increase_cooldown_days | float * 86400
                 and lower_limit | float <= upper_limit | float }}
          - variables:
              old_reserve: "{{ states(reserve_entity) | float(none) }}"
              new_reserve: >-
                {% set current = states(reserve_entity) | float(-1) %}
                {% set soc = states(soc_entity) | float(-1) %}
                {% set high = [upper_limit | float, state_attr(reserve_entity, 'max') | float(100)] | min %}
                {% set safe = (soc - 1) | round(0, 'floor') %}
                {% if current >= 0 and soc >= 0 and safe > current %}
                  {{ [high, current + up_step | float, safe] | min }}
                {% else %}
                  {{ current }}
                {% endif %}
          - condition: template
            value_template: >-
              {{ old_reserve is not none
                 and new_reserve | float > old_reserve | float
                 and new_reserve | float <= upper_limit | float
                 and new_reserve | float <= states(soc_entity) | float(-1) - 1 }}
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ new_reserve | float }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_increase
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

mode: queued
max: 5
