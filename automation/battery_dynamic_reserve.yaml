blueprint:
  name: "Batterieregelung: Dynamische Mindestreserve"
  description: >
    Prueft taeglich den SOC-Verlauf. Sind innerhalb des kurzen Zeitfensters
    sowohl 100 Prozent als auch die eingestellte Reserve erreicht worden,
    wird die Reserve reduziert. Andernfalls wird sie erhoeht, wenn waehrend
    X Tagen keine 100 Prozent, aber taeglich die Reserve erreicht wurde
    und die Reserve selbst unveraendert blieb. Benutzt Recorder-History
    ueber sql.query (SQLite und MariaDB) und braucht ausreichend lange History.
    Erhoehungen bleiben mindestens 1 Prozentpunkt unter dem aktuellen SOC.
    Die SQL-Abfragen filtern auf die ausgewaehlten Entities und Zeitfenster;
    nichtnumerische SOC-Zustaende werden ausgeschlossen.
  domain: automation
  input:
    battery_soc:
      name: Akku-Ladezustand
      selector:
        entity:
          domain: sensor
    reserve_number:
      name: Mindestreserve
      selector:
        entity:
          domain: number
    adjustment_time:
      name: Pruefzeit
      default: "20:00:00"
      selector:
        time: {}
    short_window_hours:
      name: Kurzes Beobachtungsfenster (Stunden)
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: h
          mode: box
    increase_window_days:
      name: Beobachtungszeitraum fuer Erhoehung (Tage)
      default: 3
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: d
          mode: box
    increase_step_percent:
      name: Schrittweite Erhoehung (Prozentpunkte)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    decrease_step_percent:
      name: Schrittweite Reduzierung (Prozentpunkte)
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_reserve:
      name: Untere Reservegrenze
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_reserve:
      name: Obere Reservegrenze
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

triggers:
  - trigger: time
    at: !input adjustment_time

conditions: []

actions:
  - variables:
      soc_entity: !input battery_soc
      reserve_entity: !input reserve_number
      short_hours: !input short_window_hours
      long_days: !input increase_window_days
      up_step: !input increase_step_percent
      down_step: !input decrease_step_percent
      lower_limit: !input min_reserve
      upper_limit: !input max_reserve
      current_reserve: "{{ states(reserve_entity) | float(none) }}"
  - condition: template
    value_template: >-
      {{ current_reserve is not none and lower_limit | float <= upper_limit | float }}
  - variables:
      history_end_ts: "{{ as_timestamp(now()) | int }}"
      history_start_ts: "{{ (as_timestamp(now()) - (long_days | int) * 86400) | int }}"
      short_start_ts: "{{ (as_timestamp(now()) - (short_hours | int) * 3600) | int }}"
  - action: sql.query
    data:
      query: >-
        SELECT
          MAX(CASE WHEN s.last_updated_ts >= {{ short_start_ts | int }}
              THEN CAST(s.state AS DECIMAL(10,3)) END) AS short_max,
          MIN(CASE WHEN s.last_updated_ts >= {{ short_start_ts | int }}
              THEN CAST(s.state AS DECIMAL(10,3)) END) AS short_min,
          MAX(CAST(s.state AS DECIMAL(10,3))) AS long_max,
          MIN(s.last_updated_ts) AS first_sample
          {% for day in range(long_days | int) %}
          ,MAX(CASE WHEN s.last_updated_ts >= {{ (history_end_ts | int) - (day + 1) * 86400 }}
              AND s.last_updated_ts < {{ (history_end_ts | int) - day * 86400 }}
              AND CAST(s.state AS DECIMAL(10,3)) <= {{ current_reserve | float }}
              THEN 1 ELSE 0 END) AS min_day_{{ day }}
          {% endfor %}
        FROM states s
        JOIN states_meta m ON s.metadata_id = m.metadata_id
        WHERE m.entity_id = '{{ soc_entity }}'
          AND s.last_updated_ts >= {{ history_start_ts | int }}
          AND s.last_updated_ts <= {{ history_end_ts | int }}
          AND s.state NOT IN ('unknown', 'unavailable', 'none', '', '.')
          AND (
            CAST(s.state AS DECIMAL(10,3)) BETWEEN 0.001 AND 100
            OR s.state IN ('0', '0.0', '0.00', '0.000')
          )
    response_variable: soc_history
  - action: sql.query
    data:
      query: >-
        SELECT
          COUNT(*) AS changes,
          (SELECT CAST(p.state AS DECIMAL(10,3))
           FROM states p
           JOIN states_meta pm ON pm.metadata_id = p.metadata_id
           WHERE pm.entity_id = '{{ reserve_entity }}'
             AND p.last_updated_ts < {{ history_start_ts | int }}
             AND p.state NOT IN ('unknown', 'unavailable', '')
           ORDER BY p.last_updated_ts DESC, p.state_id DESC
           LIMIT 1) AS initial_reserve
        FROM states s
        JOIN states_meta m ON m.metadata_id = s.metadata_id
        WHERE m.entity_id = '{{ reserve_entity }}'
          AND s.last_updated_ts >= {{ history_start_ts | int }}
          AND s.last_updated_ts <= {{ history_end_ts | int }}
          AND s.state NOT IN ('unknown', 'unavailable', '')
          AND CAST(s.state AS DECIMAL(10,3)) <> {{ current_reserve | float }}
    response_variable: reserve_history
  - variables:
      short_max: >-
        {% set rows = soc_history.get('result', []) %}
        {{ rows[0].get('short_max') | float(-1) if rows | count else -1 }}
      short_min: >-
        {% set rows = soc_history.get('result', []) %}
        {{ rows[0].get('short_min') | float(101) if rows | count else 101 }}
      long_max: >-
        {% set rows = soc_history.get('result', []) %}
        {{ rows[0].get('long_max') | float(-1) if rows | count else -1 }}
      all_days_minimum: >-
        {% set rows = soc_history.get('result', []) %}
        {% set ns = namespace(ok=rows | count > 0) %}
        {% if rows | count > 0 %}
          {% for day in range(long_days | int) %}
            {% if rows[0].get('min_day_' ~ day, 0) | int(0) != 1 %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.ok }}
      first_sample: >-
        {% set rows = soc_history.get('result', []) %}
        {{ rows[0].get('first_sample') | float(0) if rows | count else 0 }}
      initial_reserve: >-
        {% set rows = reserve_history.get('result', []) %}
        {{ rows[0].get('initial_reserve') | float(-1) if rows | count else -1 }}
      reserve_changes: >-
        {% set rows = reserve_history.get('result', []) %}
        {{ rows[0].get('changes') | int(999) if rows | count else 999 }}
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ short_max | float(-1) >= 100
                 and short_min | float(101) <= current_reserve | float }}
        sequence:
          - variables:
              desired_reserve: >-
                {% set low = [lower_limit | float, state_attr(reserve_entity, 'min') | float(0)] | max %}
                {{ [low, (current_reserve | float) - (down_step | float)] | max }}
          - condition: template
            value_template: "{{ desired_reserve | float < current_reserve | float }}"
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ desired_reserve | float }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ long_max | float(-1) >= 0
                 and long_max | float(-1) < 100
                 and all_days_minimum | bool(false)
                 and first_sample | float(0) <= as_timestamp(now()) - (long_days | int) * 86400 + 3600
                 and reserve_changes | int(999) == 0
                 and initial_reserve | float(-1) == current_reserve | float }}
        sequence:
          - variables:
              desired_reserve: >-
                {% set current = current_reserve | float %}
                {% set soc = states(soc_entity) | float(-1) %}
                {% set high = [upper_limit | float, state_attr(reserve_entity, 'max') | float(100)] | min %}
                {% set safe = (soc - 1) | round(0, 'floor') %}
                {% if soc >= 0 and safe > current %}
                  {{ [high, current + (up_step | float), safe] | min }}
                {% else %}
                  {{ current }}
                {% endif %}
          - condition: template
            value_template: >-
              {{ desired_reserve | float > current_reserve | float
                 and desired_reserve | float <= states(soc_entity) | float(-1) - 1 }}
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ desired_reserve | float }}"

mode: single
