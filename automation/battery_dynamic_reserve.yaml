blueprint:
  name: "Batterieregelung: Dynamische Mindestreserve"
  description: >
    Prueft taeglich den SOC-Verlauf. Sind innerhalb des kurzen Zeitfensters
    sowohl 100 Prozent als auch die eingestellte Reserve erreicht worden,
    wird die Reserve reduziert. Andernfalls wird sie erhoeht, wenn waehrend
    X Tagen keine 100 Prozent, aber taeglich die Reserve erreicht wurde
    und die Reserve selbst unveraendert blieb. Benutzt Recorder-History
    ueber recorder.get_statistics (Stundenwerte, ohne SQL und Helfer).
    Erhoehungen bleiben mindestens 1 Prozentpunkt unter dem aktuellen SOC.
    Der SOC-Sensor muss Langzeitstatistiken bereitstellen. Fehlende Statistik-
    stunden verhindern eine Erhoehung; die Reservepruefung nutzt last_changed.
  domain: automation
  input:
    battery_soc:
      name: Akku-Ladezustand
      selector:
        entity:
          domain: sensor
    reserve_number:
      name: Mindestreserve
      selector:
        entity:
          domain: number
    adjustment_time:
      name: Pruefzeit
      default: "20:00:00"
      selector:
        time: {}
    short_window_hours:
      name: Kurzes Beobachtungsfenster (Stunden)
      default: 12
      selector:
        number:
          min: 1
          max: 48
          step: 1
          unit_of_measurement: h
          mode: box
    increase_window_days:
      name: Beobachtungszeitraum fuer Erhoehung (Tage)
      default: 3
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: d
          mode: box
    increase_step_percent:
      name: Schrittweite Erhoehung (Prozentpunkte)
      default: 5
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    decrease_step_percent:
      name: Schrittweite Reduzierung (Prozentpunkte)
      default: 10
      selector:
        number:
          min: 1
          max: 30
          step: 1
          unit_of_measurement: "%"
          mode: box
    min_reserve:
      name: Untere Reservegrenze
      default: 10
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    max_reserve:
      name: Obere Reservegrenze
      default: 40
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box

triggers:
  - trigger: time
    at: !input adjustment_time

conditions: []

actions:
  - variables:
      soc_entity: !input battery_soc
      reserve_entity: !input reserve_number
      short_hours: !input short_window_hours
      long_days: !input increase_window_days
      up_step: !input increase_step_percent
      down_step: !input decrease_step_percent
      lower_limit: !input min_reserve
      upper_limit: !input max_reserve
      current_reserve: "{{ states(reserve_entity) | float(none) }}"
  - condition: template
    value_template: >-
      {{ current_reserve is not none and lower_limit | float <= upper_limit | float }}
  - variables:
      history_end_ts: "{{ as_timestamp(now()) | int }}"
      history_start_ts: "{{ (as_timestamp(now()) - (long_days | int) * 86400) | int }}"
      short_start_ts: "{{ (as_timestamp(now()) - (short_hours | int) * 3600) | int }}"
      statistics_start_ts: "{{ (as_timestamp(now()) - ([short_hours | int, (long_days | int) * 24] | max + 2) * 3600) | int }}"
  - action: recorder.get_statistics
    data:
      statistic_ids:
        - "{{ soc_entity }}"
      start_time: "{{ (statistics_start_ts | int) | timestamp_local }}"
      end_time: "{{ now().isoformat() }}"
      period: hour
      types:
        - min
        - max
    response_variable: soc_statistics
  - variables:
      stats_rows: "{{ soc_statistics.get('statistics', {}).get(soc_entity, []) }}"
      short_max: >-
        {% set ns = namespace(v=-1) %}
        {% for r in stats_rows %}
          {% if as_timestamp(r.get('end'), 0) > short_start_ts | int
                and as_timestamp(r.get('start'), 0) <= history_end_ts | int
                and r.get('max') is not none %}
            {% set ns.v = [ns.v, r.get('max') | float(-1)] | max %}
          {% endif %}
        {% endfor %}
        {{ ns.v }}
      short_min: >-
        {% set ns = namespace(v=101) %}
        {% for r in stats_rows %}
          {% if as_timestamp(r.get('end'), 0) > short_start_ts | int
                and as_timestamp(r.get('start'), 0) <= history_end_ts | int
                and r.get('min') is not none %}
            {% set ns.v = [ns.v, r.get('min') | float(101)] | min %}
          {% endif %}
        {% endfor %}
        {{ ns.v }}
      long_max: >-
        {% set ns = namespace(v=-1) %}
        {% for r in stats_rows %}
          {% if as_timestamp(r.get('end'), 0) > history_start_ts | int
                and as_timestamp(r.get('start'), 0) <= history_end_ts | int
                and r.get('max') is not none %}
            {% set ns.v = [ns.v, r.get('max') | float(-1)] | max %}
          {% endif %}
        {% endfor %}
        {{ ns.v }}
      all_days_minimum: >-
        {% set ns = namespace(ok=true) %}
        {% for day in range(long_days | int) %}
          {% set d = namespace(found=false, hours=0) %}
          {% set bucket_start = (history_end_ts | int) - (day + 1) * 86400 %}
          {% set bucket_end = (history_end_ts | int) - day * 86400 %}
          {% for r in stats_rows %}
            {% set start = as_timestamp(r.get('start'), 0) %}
            {% set end = as_timestamp(r.get('end'), 0) %}
            {% if end > bucket_start and start < bucket_end
                  and r.get('min') is not none and r.get('max') is not none %}
              {% set d.hours = d.hours + 1 %}
              {% if r.get('min') | float(101) <= current_reserve | float %}
                {% set d.found = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if not d.found or d.hours < 23 %}
            {% set ns.ok = false %}
          {% endif %}
        {% endfor %}
        {{ ns.ok }}
      reserve_unchanged: >-
        {{ has_value(reserve_entity)
           and as_timestamp(states[reserve_entity].last_changed, 0) <= history_start_ts | int }}
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ short_max | float(-1) >= 100
                 and short_min | float(101) <= current_reserve | float }}
        sequence:
          - variables:
              desired_reserve: >-
                {% set low = [lower_limit | float, state_attr(reserve_entity, 'min') | float(0)] | max %}
                {{ [low, (current_reserve | float) - (down_step | float)] | max }}
          - condition: template
            value_template: "{{ desired_reserve | float < current_reserve | float }}"
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ desired_reserve | float }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ long_max | float(-1) >= 0
                 and long_max | float(-1) < 100
                 and all_days_minimum | bool(false)
                 and reserve_unchanged | bool(false) }}
        sequence:
          - variables:
              desired_reserve: >-
                {% set current = current_reserve | float %}
                {% set soc = states(soc_entity) | float(-1) %}
                {% set high = [upper_limit | float, state_attr(reserve_entity, 'max') | float(100)] | min %}
                {% set safe = (soc - 1) | round(0, 'floor') %}
                {% if soc >= 0 and safe > current %}
                  {{ [high, current + (up_step | float), safe] | min }}
                {% else %}
                  {{ current }}
                {% endif %}
          - condition: template
            value_template: >-
              {{ desired_reserve | float > current_reserve | float
                 and desired_reserve | float <= states(soc_entity) | float(-1) - 1 }}
          - action: number.set_value
            target:
              entity_id: !input reserve_number
            data:
              value: "{{ desired_reserve | float }}"

mode: single
