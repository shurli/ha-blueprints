      - "07:45:00"
      - "08:00:00"
      - "08:15:00"
      - "08:30:00"
      - "08:45:00"
      - "09:00:00"
      - "09:15:00"
      - "09:30:00"
      - "09:45:00"
      - "10:00:00"
      - "10:15:00"
      - "10:30:00"
      - "10:45:00"
      - "11:00:00"
      - "11:15:00"
      - "11:30:00"
      - "11:45:00"
      - "12:00:00"
      - "12:15:00"
      - "12:30:00"
      - "12:45:00"
      - "13:00:00"
      - "13:15:00"
      - "13:30:00"
      - "13:45:00"
      - "14:00:00"
      - "14:15:00"
      - "14:30:00"
      - "14:45:00"
      - "15:00:00"
      - "15:15:00"
      - "15:30:00"
      - "15:45:00"
      - "16:00:00"
      - "16:15:00"
      - "16:30:00"
      - "16:45:00"
      - "17:00:00"
      - "17:15:00"
      - "17:30:00"
      - "17:45:00"
      - "18:00:00"
      - "18:15:00"
      - "18:30:00"
      - "18:45:00"
      - "19:00:00"
      - "19:15:00"
      - "19:30:00"
      - "19:45:00"
      - "20:00:00"
      - "20:15:00"
      - "20:30:00"
      - "20:45:00"
      - "21:00:00"
      - "21:15:00"
      - "21:30:00"
      - "21:45:00"
      - "22:00:00"
    id: solar_update

  - trigger: state
    entity_id: !input sunshine_sensor
    id: sunshine_changed

  - trigger: state
    entity_id: !input window_sensor
    id: window_changed

  - trigger: state
    entity_id: !input wind_sensor
    id: wind_changed

  - trigger: state
    entity_id: !input rain_sensor
    id: rain_changed

  - trigger: state
    entity_id: !input cover_entity
    attribute: current_tilt_position
    for:
      seconds: !input manual_detection_delay
    id: cover_tilt_changed

  - trigger: state
    entity_id: !input cover_entity
    attribute: current_position
    for:
      seconds: !input manual_detection_delay
    id: cover_position_changed

conditions: []

actions:
  - choose:
      - alias: "FSM: abgelaufene Rückmelde-Sperre auflösen"
        conditions:
          - alias: "FSM steht auf ignore_feedback und Sperrzeit ist abgelaufen"
            condition: template
            value_template: "{{ fsm_state == 'ignore_feedback' and ignore_feedback_expired }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": fsm_next | default('night', true),
                    "p": "ignore_feedback",
                    "n": none,
                    "a": fsm_action,
                    "tt": fsm_target_tilt,
                    "op": fsm_original_position,
                    "ot": fsm_original_tilt,
                    "ec": fsm_external_change
                  } | to_json
                }}

  - choose:
      - alias: "Initialisierung nach Home-Assistant-Start"
        conditions:
          - alias: "Trigger ist Home Assistant Start"
            condition: trigger
            id: ha_start
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": phase_state,
                    "p": fsm_state,
                    "n": none,
                    "a": "ha_start",
                    "tt": none,
                    "op": none,
                    "ot": none,
                    "ec": false
                  } | to_json
                }}

      - alias: "Sonnenuntergang: FSM auf night zurücksetzen"
        conditions:
          - alias: "Trigger ist Sonnenuntergang"
            condition: trigger
            id: sunset
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "night",
                    "p": effective_state,
                    "n": none,
                    "a": "sunset",
                    "tt": none,
                    "op": none,
                    "ot": none,
                    "ec": false
                  } | to_json
                }}

      - alias: "Windschutz aktivieren"
        conditions:
          - alias: "Trigger ist Windsensor"
            condition: trigger
            id: wind_changed
          - alias: "Wind ist aktiv"
            condition: template
            value_template: "{{ wind_active }}"
          - alias: "FSM ist noch nicht windy"
            condition: template
            value_template: "{{ effective_state != 'windy' }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "windy",
                    "p": effective_state,
                    "n": none,
                    "a": "wind_on",
                    "tt": fsm_target_tilt,
                    "op": fsm_original_position,
                    "ot": fsm_original_tilt,
                    "ec": fsm_external_change
                  } | to_json
                }}

          - choose:
              - alias: "Windaktion: Jalousie öffnen"
                conditions:
                  - alias: "Windaktion ist open"
                    condition: template
                    value_template: "{{ wind_action == 'open' }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover_entity

              - alias: "Windaktion: Jalousie schließen"
                conditions:
                  - alias: "Windaktion ist close"
                    condition: template
                    value_template: "{{ wind_action == 'close' }}"
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover_entity

      - alias: "Windschutz beenden"
        conditions:
          - alias: "Trigger ist Windsensor"
            condition: trigger
            id: wind_changed
          - alias: "Wind ist nicht mehr aktiv"
            condition: template
            value_template: "{{ not wind_active }}"
          - alias: "FSM steht auf windy"
            condition: template
            value_template: "{{ effective_state == 'windy' }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {% set resume =
                    'window_tilt' if not window_is_closed
                    else 'rainy' if rain_active and effective_state != 'pre_morning'
                    else fsm_previous if fsm_previous == 'manual_override'
                    else phase_state
                %}
                {{
                  {
                    "s": resume,
                    "p": "windy",
                    "n": none,
                    "a": "wind_off",
                    "tt": fsm_target_tilt,
                    "op": fsm_original_position,
                    "ot": fsm_original_tilt,
                    "ec": fsm_external_change
                  } | to_json
                }}

      - alias: "Regenschutz aktivieren"
        conditions:
          - alias: "Trigger ist Regensensor"
            condition: trigger
            id: rain_changed
          - alias: "Regen ist aktiv"
            condition: template
            value_template: "{{ rain_active }}"
          - alias: "Windschutz ist nicht aktiv"
            condition: template
            value_template: "{{ not wind_active }}"
          - alias: "FSM ist noch nicht rainy"
            condition: template
            value_template: "{{ effective_state != 'rainy' }}"
          - alias: "Pre-Morning hat Vorrang vor rainy"
            condition: template
            value_template: "{{ effective_state != 'pre_morning' }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "rainy",
                    "p": effective_state,
                    "n": none,
                    "a": "rain_on",
                    "tt": fsm_target_tilt,
                    "op": fsm_original_position,
                    "ot": fsm_original_tilt,
                    "ec": fsm_external_change
                  } | to_json
                }}

          - choose:
              - alias: "Regenaktion: Jalousie öffnen"
                conditions:
                  - alias: "Regenaktion ist open"
                    condition: template
                    value_template: "{{ rain_action == 'open' }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover_entity

              - alias: "Regenaktion: Jalousie schließen"
                conditions:
                  - alias: "Regenaktion ist close"
                    condition: template
                    value_template: "{{ rain_action == 'close' }}"
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover_entity

      - alias: "Regenschutz beenden"
        conditions:
          - alias: "Trigger ist Regensensor"
            condition: trigger
            id: rain_changed
          - alias: "Regen ist nicht mehr aktiv"
            condition: template
            value_template: "{{ not rain_active }}"
          - alias: "FSM steht auf rainy"
            condition: template
            value_template: "{{ effective_state == 'rainy' }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {% set resume =
                    'window_tilt' if not window_is_closed
                    else fsm_previous if fsm_previous == 'manual_override'
                    else phase_state
                %}
                {{
                  {
                    "s": resume,
                    "p": "rainy",
                    "n": none,
                    "a": "rain_off",
                    "tt": fsm_target_tilt,
                    "op": fsm_original_position,
                    "ot": fsm_original_tilt,
                    "ec": fsm_external_change
                  } | to_json
                }}

      - alias: "Fenster geöffnet: Fenster-Kippstellung setzen"
        conditions:
          - alias: "Trigger ist Fenstersensor"
            condition: trigger
            id: window_changed
          - alias: "Fenster ist offen"
            condition: template
            value_template: "{{ not window_is_closed }}"
          - alias: "Kein Windschutz aktiv"
            condition: template
            value_template: "{{ not wind_active }}"
          - alias: "FSM ist noch nicht window_tilt"
            condition: template
            value_template: "{{ effective_state != 'window_tilt' }}"
          - alias: "Jalousie ist geschlossen oder fast geschlossen"
            condition: template
            value_template: "{{ cover_is_closed }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "window_tilt",
                    "p": effective_state,
                    "n": none,
                    "a": "window_open",
                    "tt": window_tilt_position | int,
                    "op": current_position if current_position >= 0 else none,
                    "ot": current_tilt if current_tilt >= 0 else none,
                    "ec": false
                  } | to_json
                }}

          - action: cover.set_cover_tilt_position
            target:
              entity_id: !input cover_entity
            data:
              tilt_position: "{{ window_tilt_position | int }}"

      - alias: "Fenster geschlossen: ggf. ursprüngliche Stellung wiederherstellen"
        conditions:
          - alias: "Trigger ist Fenstersensor"
            condition: trigger
            id: window_changed
          - alias: "Fenster ist geschlossen"
            condition: template
            value_template: "{{ window_is_closed }}"
          - alias: "FSM steht auf window_tilt"
            condition: template
            value_template: "{{ effective_state == 'window_tilt' }}"
        sequence:
          - choose:
              - alias: "Fenster zu: ursprüngliche Stellung wiederherstellen"
                conditions:
                  - alias: "Wiederherstellung ist erlaubt und keine externe Änderung erkannt"
                    condition: template
                    value_template: >
                      {{ restore_after_window_close | bool
                         and not (fsm_external_change | bool) }}
                sequence:
                  - choose:
                      - alias: "Fenster-Restore: ursprüngliche Position setzen"
                        conditions:
                          - alias: "Originalposition ist gespeichert"
                            condition: template
                            value_template: >
                              {{ fsm_original_position not in [none, '', 'None', 'none'] }}
                        sequence:
                          - action: cover.set_cover_position
                            target:
                              entity_id: !input cover_entity
                            data:
                              position: "{{ fsm_original_position | int }}"

                  - choose:
                      - alias: "Fenster-Restore: ursprünglichen Tilt setzen"
                        conditions:
                          - alias: "Original-Tilt ist gespeichert"
                            condition: template
                            value_template: >
                              {{ fsm_original_tilt not in [none, '', 'None', 'none'] }}
                        sequence:
                          - action: cover.set_cover_tilt_position
                            target:
                              entity_id: !input cover_entity
                            data:
                              tilt_position: "{{ fsm_original_tilt | int }}"

                  - action: input_text.set_value
                    target:
                      entity_id: !input fsm_helper
                    data:
                      value: >
                        {% set next =
                            'manual_override' if fsm_previous == 'manual_override'
                            else phase_state
                        %}
                        {{
                          {
                            "s": "ignore_feedback",
                            "p": "window_tilt",
                            "n": next,
                            "a": "window_restore",
                            "tt": none,
                            "op": none,
                            "ot": none,
                            "ec": false,
                            "iu": ignore_until_new
                          } | to_json
                        }}

            default:
              - action: input_text.set_value
                target:
                  entity_id: !input fsm_helper
                data:
                  value: >
                    {% set next =
                        'manual_override' if fsm_previous == 'manual_override'
                        else phase_state
                    %}
                    {{
                      {
                        "s": next,
                        "p": "window_tilt",
                        "n": none,
                        "a": "window_closed_no_restore",
                        "tt": none,
                        "op": none,
                        "ot": none,
                        "ec": false
                      } | to_json
                    }}

      - alias: "Fenster offen: externe Änderung erkennen"
        conditions:
          - alias: "Trigger ist Cover-Position oder Cover-Tilt"
            condition: template
            value_template: "{{ trigger.id in ['cover_tilt_changed', 'cover_position_changed'] }}"
          - alias: "Keine aktive Rückmelde-Sperre"
            condition: template
            value_template: >
              {{ fsm_state != 'ignore_feedback' or ignore_feedback_expired }}
          - alias: "FSM steht auf window_tilt"
            condition: template
            value_template: "{{ effective_state == 'window_tilt' }}"
          - alias: "Fenster ist weiterhin offen"
            condition: template
            value_template: "{{ not window_is_closed }}"
          - alias: "Coveränderung weicht von Fenster-Kippstellung ab"
            condition: template
            value_template: >
              {% if trigger.id == 'cover_tilt_changed' %}
                {% set new_tilt = trigger.to_state.attributes.current_tilt_position | int(-1) %}
                {{ new_tilt >= 0
                   and ((new_tilt - (window_tilt_position | int)) | abs) > (manual_tilt_tolerance | int) }}
              {% else %}
                {% set from_pos = trigger.from_state.attributes.current_position | int(-1) %}
                {% set to_pos = trigger.to_state.attributes.current_position | int(-1) %}
                {{ from_pos >= 0
                   and to_pos >= 0
                   and ((to_pos - from_pos) | abs) > (manual_position_tolerance | int) }}
              {% endif %}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "window_tilt",
                    "p": fsm_previous,
                    "n": none,
                    "a": "window_external_change",
                    "tt": window_tilt_position | int,
                    "op": fsm_original_position,
                    "ot": fsm_original_tilt,
                    "ec": true
                  } | to_json
                }}

      - alias: "Pre-Morning: Schlafschutz aktivieren"
        conditions:
          - alias: "Trigger ist Helligkeit oder Sonnenhöhe"
            condition: template
            value_template: "{{ trigger.id in ['pre_morning_brightness', 'pre_morning_elevation'] }}"
          - alias: "Kein Windschutz und Fenster geschlossen"
            condition: template
            value_template: "{{ not wind_active and window_is_closed }}"
          - alias: "Pre-Morning nur aus night/evening/rainy"
            condition: template
            value_template: "{{ effective_state in ['night', 'evening', 'rainy'] }}"
        sequence:
          - choose:
              - alias: "Pre-Morning: Jalousie schließen"
                conditions:
                  - alias: "Pre-Morning-Schließen ist aktiv und Jalousie ist nicht geschlossen"
                    condition: template
                    value_template: >
                      {{ pre_morning_close_enabled | bool
                         and not cover_is_closed }}
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover_entity

                  - action: input_text.set_value
                    target:
                      entity_id: !input fsm_helper
                    data:
                      value: >
                        {{
                          {
                            "s": "ignore_feedback",
                            "p": effective_state,
                            "n": "pre_morning",
                            "a": "pre_morning_close",
                            "tt": none,
                            "op": none,
                            "ot": none,
                            "ec": false,
                            "iu": ignore_until_new
                          } | to_json
                        }}

            default:
              - action: input_text.set_value
                target:
                  entity_id: !input fsm_helper
                data:
                  value: >
                    {{
                      {
                        "s": "pre_morning",
                        "p": effective_state,
                        "n": none,
                        "a": "pre_morning",
                        "tt": none,
                        "op": none,
                        "ot": none,
                        "ec": false
                      } | to_json
                    }}

      - alias: "Morgenfunktion: Jalousie tilten oder öffnen"
        conditions:
          - alias: "Trigger ist eine Wochentags-Morgenzeit"
            condition: template
            value_template: >
              {{ trigger.id in [
                'morning_monday',
                'morning_tuesday',
                'morning_wednesday',
                'morning_thursday',
                'morning_friday',
                'morning_saturday',
                'morning_sunday_or_holiday'
              ] }}
          - alias: "Morgenfunktion ist aktiviert"
            condition: template
            value_template: "{{ morning_enabled | bool }}"
          - alias: "Fenster ist geschlossen"
            condition: template
            value_template: "{{ window_is_closed }}"
          - alias: "FSM erlaubt Morgenfunktion"
            condition: template
            value_template: >
              {{ effective_state in ['night', 'pre_morning', 'evening', 'waiting_for_sun'] }}
          - alias: "Heutiger Wochentag passt zum ausgelösten Morgen-Trigger"
            condition: template
            value_template: >
              {% set weekday = now().isoweekday() %}
              {% set is_workday = is_state(workday_sensor, 'on') %}
              {{
                (trigger.id == 'morning_monday' and weekday == 1 and is_workday)
                or
                (trigger.id == 'morning_tuesday' and weekday == 2 and is_workday)
                or
                (trigger.id == 'morning_wednesday' and weekday == 3 and is_workday)
                or
                (trigger.id == 'morning_thursday' and weekday == 4 and is_workday)
                or
                (trigger.id == 'morning_friday' and weekday == 5 and is_workday)
                or
                (trigger.id == 'morning_saturday' and weekday == 6)
                or
                (
                  trigger.id == 'morning_sunday_or_holiday'
                  and (
                    weekday == 7
                    or
                    (weekday in [1, 2, 3, 4, 5] and not is_workday)
                  )
                )
              }}
          - alias: "Jalousie ist geschlossen oder fast geschlossen"
            condition: template
            value_template: "{{ cover_is_closed }}"
        sequence:
          - choose:
              - alias: "Morgenaktion: tilten"
                conditions:
                  - alias: "Morgenmodus ist tilt"
                    condition: template
                    value_template: "{{ morning_operation_mode == 'tilt' }}"
                sequence:
                  - action: cover.set_cover_tilt_position
                    target:
                      entity_id: !input cover_entity
                    data:
                      tilt_position: "{{ morning_tilt_position | int }}"

              - alias: "Morgenaktion: öffnen"
                conditions:
                  - alias: "Morgenmodus ist open"
                    condition: template
                    value_template: "{{ morning_operation_mode == 'open' }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover_entity

          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "ignore_feedback",
                    "p": effective_state,
                    "n": "waiting_for_sun",
                    "a": "morning_" ~ morning_operation_mode,
                    "tt": morning_tilt_position | int if morning_operation_mode == 'tilt' else none,
                    "op": none,
                    "ot": none,
                    "ec": false,
                    "iu": ignore_until_new
                  } | to_json
                }}

      - alias: "Sonnenfenster verlassen: nächsten Tageszustand setzen"
        conditions:
          - alias: "Trigger ist Solar-Update oder Sonnenscheinwechsel"
            condition: template
            value_template: "{{ trigger.id in ['solar_update', 'sunshine_changed'] }}"
          - alias: "Sonne ist über dem Horizont"
            condition: template
            value_template: "{{ is_state(sun_entity, 'above_horizon') }}"
          - alias: "FSM ist aktive Sonnenbeschattung"
            condition: template
            value_template: "{{ effective_state in ['sunny_tilt', 'cloudy_tilt'] }}"
          - alias: "Sonne ist nicht mehr im Sonnenfenster"
            condition: template
            value_template: "{{ not sun_in_window }}"
          - alias: "FSM-State muss geändert werden"
            condition: template
            value_template: "{{ effective_state != phase_state }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": phase_state,
                    "p": effective_state,
                    "n": none,
                    "a": "sun_left_window",
                    "tt": fsm_target_tilt,
                    "op": none,
                    "ot": none,
                    "ec": false
                  } | to_json
                }}

      - alias: "Manuelle KNX-Übersteuerung erkennen"
        conditions:
          - alias: "Trigger ist Cover-Position oder Cover-Tilt"
            condition: template
            value_template: "{{ trigger.id in ['cover_tilt_changed', 'cover_position_changed'] }}"
          - alias: "Keine aktive Rückmelde-Sperre"
            condition: template
            value_template: >
              {{ fsm_state != 'ignore_feedback' or ignore_feedback_expired }}
          - alias: "FSM erlaubt manuelle Übersteuerung"
            condition: template
            value_template: >
              {{ effective_state in ['waiting_for_sun', 'sunny_tilt', 'cloudy_tilt'] }}
          - alias: "Fenster geschlossen, kein Wind, kein Regen"
            condition: template
            value_template: "{{ window_is_closed and not wind_active and not rain_active }}"
          - alias: "Sonne im Fenster oder Warten auf Sonne"
            condition: template
            value_template: "{{ sun_in_window or effective_state == 'waiting_for_sun' }}"
          - alias: "Coveränderung ist deutlich genug für manuellen Override"
            condition: template
            value_template: >
              {% if trigger.id == 'cover_tilt_changed' %}
                {% set new_tilt = trigger.to_state.attributes.current_tilt_position | int(-1) %}
                {% set reference = fsm_target_tilt | int(target_tilt | int) %}
                {{ new_tilt >= 0
                   and ((new_tilt - reference) | abs) > (manual_tilt_tolerance | int)
                   and ((new_tilt - (target_tilt | int)) | abs) > (manual_tilt_tolerance | int) }}
              {% elif trigger.id == 'cover_position_changed' %}
                {% set from_pos = trigger.from_state.attributes.current_position | int(-1) %}
                {% set to_pos = trigger.to_state.attributes.current_position | int(-1) %}
                {{ from_pos >= 0
                   and to_pos >= 0
                   and ((to_pos - from_pos) | abs) > (manual_position_tolerance | int) }}
              {% else %}
                false
              {% endif %}
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "manual_override",
                    "p": effective_state,
                    "n": none,
                    "a": "manual_override",
                    "tt": fsm_target_tilt,
                    "op": none,
                    "ot": none,
                    "ec": false
                  } | to_json
                }}

      - alias: "Nach Schließen für Sonnen-Tilt: Lamellen setzen"
        conditions:
          - alias: "Trigger ist Cover-Positionsänderung"
            condition: trigger
            id: cover_position_changed
          - alias: "FSM steht auf closing_for_tilt"
            condition: template
            value_template: "{{ effective_state == 'closing_for_tilt' }}"
          - alias: "Jalousie ist nicht mehr offen"
            condition: template
            value_template: "{{ not cover_is_open }}"
          - alias: "Fenster geschlossen, kein Wind, kein Regen"
            condition: template
            value_template: "{{ window_is_closed and not wind_active and not rain_active }}"
          - alias: "Sonne ist im Sonnenfenster"
            condition: template
            value_template: "{{ sun_in_window }}"
        sequence:
          - action: cover.set_cover_tilt_position
            target:
              entity_id: !input cover_entity
            data:
              tilt_position: "{{ fsm_target_tilt | int(target_tilt | int) }}"

          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": "ignore_feedback",
                    "p": "closing_for_tilt",
                    "n": target_solar_state,
                    "a": "solar_tilt_after_close",
                    "tt": target_tilt | int,
                    "op": none,
                    "ot": none,
                    "ec": false,
                    "iu": ignore_until_new
                  } | to_json
                }}

      - alias: "Sonnenbeschattung: Tilt setzen oder vorher schließen"
        conditions:
          - alias: "Trigger ist Solar-Update oder Sonnenscheinwechsel"
            condition: template
            value_template: "{{ trigger.id in ['solar_update', 'sunshine_changed'] }}"
          - alias: "Sonne ist über dem Horizont"
            condition: template
            value_template: "{{ is_state(sun_entity, 'above_horizon') }}"
          - alias: "FSM erlaubt Sonnenbeschattung"
            condition: template
            value_template: >
              {{ effective_state in [
                'pre_morning',
                'morning_tilt',
                'waiting_for_sun',
                'sunny_tilt',
                'cloudy_tilt',
                'evening'
              ] }}
          - alias: "Fenster geschlossen, kein Wind, kein Regen"
            condition: template
            value_template: "{{ window_is_closed and not wind_active and not rain_active }}"
          - alias: "Sonne ist im Sonnenfenster"
            condition: template
            value_template: "{{ sun_in_window }}"
          - alias: "Sonnenaktion ist nötig"
            condition: template
            value_template: "{{ solar_action_needed }}"
        sequence:
          - choose:
              - alias: "Sonnenbeschattung: offene Jalousie bei Sonne zuerst schließen"
                conditions:
                  - alias: "Sonnig, Schließen erlaubt und Jalousie offen"
                    condition: template
                    value_template: >
                      {{ sunshine_on
                         and close_open_cover_for_sun | bool
                         and cover_is_open }}
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover_entity

                  - action: input_text.set_value
                    target:
                      entity_id: !input fsm_helper
                    data:
                      value: >
                        {{
                          {
                            "s": "closing_for_tilt",
                            "p": effective_state,
                            "n": target_solar_state,
                            "a": "solar_close_for_tilt",
                            "tt": target_tilt | int,
                            "op": none,
                            "ot": none,
                            "ec": false
                          } | to_json
                        }}

            default:
              - action: cover.set_cover_tilt_position
                target:
                  entity_id: !input cover_entity
                data:
                  tilt_position: "{{ target_tilt | int }}"

              - action: input_text.set_value
                target:
                  entity_id: !input fsm_helper
                data:
                  value: >
                    {{
                      {
                        "s": "ignore_feedback",
                        "p": effective_state,
                        "n": target_solar_state,
                        "a": "solar_tilt",
                        "tt": target_tilt | int,
                        "op": none,
                        "ot": none,
                        "ec": false,
                        "iu": ignore_until_new
                      } | to_json
                    }}

      - alias: "Sonnenfenster erreicht: nur FSM-State aktualisieren"
        conditions:
          - alias: "Trigger ist Solar-Update oder Sonnenscheinwechsel"
            condition: template
            value_template: "{{ trigger.id in ['solar_update', 'sunshine_changed'] }}"
          - alias: "Sonne ist über dem Horizont"
            condition: template
            value_template: "{{ is_state(sun_entity, 'above_horizon') }}"
          - alias: "FSM erlaubt Solar-State-Update"
            condition: template
            value_template: >
              {{ effective_state in [
                'pre_morning',
                'morning_tilt',
                'waiting_for_sun',
                'evening',
                'sunny_tilt',
                'cloudy_tilt'
              ] }}
          - alias: "Fenster geschlossen, kein Wind, kein Regen"
            condition: template
            value_template: "{{ window_is_closed and not wind_active and not rain_active }}"
          - alias: "Sonne ist im Sonnenfenster"
            condition: template
            value_template: "{{ sun_in_window }}"
          - alias: "Keine Cover-Aktion nötig"
            condition: template
            value_template: "{{ not solar_action_needed }}"
          - alias: "FSM-State muss auf sunny/cloudy aktualisiert werden"
            condition: template
            value_template: "{{ effective_state != target_solar_state }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: !input fsm_helper
            data:
              value: >
                {{
                  {
                    "s": target_solar_state,
                    "p": effective_state,
                    "n": none,
                    "a": "solar_state_only",
                    "tt": target_tilt | int,
                    "op": none,
                    "ot": none,
                    "ec": false
                  } | to_json
                }}
